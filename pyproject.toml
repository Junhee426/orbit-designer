[project]
name = "k-leo-orbit-designer"
version = "1.0.0"
description = "Test Orbit Designer - LEO satellite communications constellation design and validation tool"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "numpy>=2.0,<3.0",
    "pydantic>=2.11,<3.0",
    "sgp4>=2.27,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.scripts]
kleo = "app.cli:main"
kleo-server = "app.server:main"
kleo-validate = "scripts.run_validation:main"
kleo-bootstrap-assets = "scripts.bootstrap_cesium:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "trimesh>=4.7,<5.0",
]

[build-system]
requires = ["setuptools>=82,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
default-groups = ["dev"]
