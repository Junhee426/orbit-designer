name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - name: Build and verify Render static site
        run: npm run build:render
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: orbit-lab-static-site
          path: standalone/
          retention-days: 7
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Compile Python sources
        run: uv run python -m compileall -q app scripts

      - name: Run tests
        run: uv run pytest -q

      - name: Check frontend syntax
        run: uv run python -m scripts.check_frontend
