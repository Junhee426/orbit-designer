# Browser edition. For the Python service, use render-docker.yaml.
services:
  - type: web
    name: kleo-orbit-lab-browser
    runtime: static
    buildCommand: npm ci --ignore-scripts --include=dev --no-audit --no-fund && npm run build:render
    staticPublishPath: ./standalone
    autoDeployTrigger: commit
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
